# CI：纯合成数据，不触碰 SAP / Outlook / Excel / PAD
# 注意：run: 的脚本正文必须是纯 ASCII。GitHub 把脚本落盘为无 BOM 的 .ps1，
# Windows PowerShell 会按 ANSI 解码，中文会破坏语法（历史踩坑）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # PadConfigure 的探查用例需要真实的 python.exe；探查里还会 import openpyxl
      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 Python 依赖
        run: python -m pip install --upgrade pip openpyxl

      - name: 安装 Pester 3.4（与 PowerShell 5.1 的语法一致）
        shell: powershell
        run: Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Pester（逐个文件，任一失败即失败）
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          Write-Host "Pester version=$((Get-Module Pester).Version)"
          $failed = 0
          $failLines = @()
          Get-ChildItem tests\*.Tests.ps1 | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            $r = Invoke-Pester -Script $_.FullName -PassThru
            Write-Host "passed=$($r.PassedCount) failed=$($r.FailedCount)"
            $r.TestResult | Where-Object { -not $_.Passed } | ForEach-Object {
              $line = "[$($_.Describe)] $($_.Name) :: $($_.FailureMessage)"
              Write-Host "FAIL: $line"
              Write-Host "::error title=Pester failure::$line"
              $failLines += $line
            }
            $failed += $r.FailedCount
          }
          if ($failLines.Count -gt 0) {
            "## Pester failures" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $failLines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          if ($failed -gt 0) { throw "Pester failed cases: $failed" }

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 拉取动作知识库（生成器与静态校验依赖它）
        shell: powershell
        run: git clone --depth 1 https://github.com/JoeG592/pad-robin-action-kb.git pad-robin-action-kb

      - name: 设计质量评估集（结构断言）
        run: node tools\pad-robin\eval-flow.js tests\eval

      - name: 准入网关（只读）
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\pad-sync\pad-admit.ps1 -FlowFile tools\flow-drawio\example-flow.json
          if ($LASTEXITCODE -ne 0) { throw "admit gate failed: $LASTEXITCODE" }

      - name: 示例流程 → Robin → 静态校验
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $gen = (& node tools\pad-robin\flow-to-robin.js tools\flow-drawio\example-flow.json "$env:RUNNER_TEMP\example.robin" --no-check 2>&1 | Out-String)
          $c1 = $LASTEXITCODE
          Write-Host "--- generate code=$c1 ---"
          Write-Host $gen
          if ($c1 -ne 0) {
            Write-Host "::error title=generate failed::$($gen -replace "`r?`n", ' | ')"
            throw "generate failed: $c1"
          }
          $chk = (& node tools\pad-robin\check.js "$env:RUNNER_TEMP\example.robin" 2>&1 | Out-String)
          $c2 = $LASTEXITCODE
          Write-Host "--- static check code=$c2 ---"
          Write-Host $chk
          if ($c2 -ne 0) {
            Write-Host "::error title=static check failed::$($chk -replace "`r?`n", ' | ')"
            throw "static check failed: $c2"
          }

      - name: 生成器与对比器单元测试
        run: node --test tools\pad-robin\flow-to-robin.test.js tools\pad-robin\compare-robin.test.js
